<!doctype html><html><head><meta charset=utf8><title>teeth tuner</title>
<style>
 body{font:14px system-ui;margin:0;background:#1a1a1e;color:#ddd;display:flex;height:100vh}
 #ctrl{width:430px;overflow:auto;padding:16px;box-sizing:border-box;border-right:1px solid #333}
 #view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c0c0e}
 #view img{max-width:96%;border:1px solid #333;border-radius:6px}
 h3{margin:14px 0 6px;color:#9cf}
 .g{display:grid;grid-template-columns:70px 1fr 64px;gap:6px;align-items:center;margin:3px 0}
 input[type=range]{width:100%} .v{font-variant-numeric:tabular-nums;color:#aaa;text-align:right}
 .row{display:flex;gap:8px;align-items:center;margin:4px 0}
 .part{border:1px solid #333;border-radius:6px;padding:6px 10px;margin:8px 0}
 input[type=color]{width:48px;height:24px;border:0;background:none}
 select{background:#222;color:#ddd;border:1px solid #444;padding:4px}
 #status{color:#9c9;height:18px;margin-top:8px}
 label.lab{display:flex;align-items:center;gap:6px}
</style></head><body>
<div id=ctrl>
 <div class=row><b>Teeth tuner</b><span style=flex:1></span>
   <label class=lab>body <select id=gender onchange=go()><option>female</option><option>male</option></select></label>
   <label class=lab><input type=checkbox id=live checked> live</label></div>
 <div id=globals></div><div id=parts></div>
 <div id=status>warming up…</div>
</div>
<div id=view><img id=img></div>
<script>
const P=__PARAMS__, GLOBALS=__GLOBALS__, FIELDS=__FIELDS__, PARTS=__PARTS__;
const hex=c=>'#'+c.map(x=>(+x).toString(16).padStart(2,'0')).join('');
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
let timer=null, busy=false, pending=false;
function schedule(){ if(!document.getElementById('live').checked) return;
  clearTimeout(timer); timer=setTimeout(go,120); }
function slider(key,val,lo,hi,st,onin){
  const d=document.createElement('div');d.className='g';
  d.innerHTML=`<label>${key}</label><input type=range min=${lo} max=${hi} step=${st} value=${val}><span class=v>${(+val).toFixed(4)}</span>`;
  const r=d.querySelector('input'),v=d.querySelector('.v');
  r.oninput=()=>{v.textContent=(+r.value).toFixed(4);onin(+r.value);schedule()};return d;
}
const G=document.getElementById('globals');G.innerHTML='<h3>global</h3>';
GLOBALS.forEach(([k,lo,hi,st])=>G.appendChild(slider(k,P[k],lo,hi,st,x=>P[k]=x)));
const PD=document.getElementById('parts');
PARTS.forEach(name=>{const box=document.createElement('div');box.className='part';box.innerHTML=`<h3>${name}</h3>`;
  FIELDS.forEach(([f,lo,hi,st])=>box.appendChild(slider(f,P[name][f],lo,hi,st,x=>P[name][f]=x)));
  const cr=document.createElement('div');cr.className='row';cr.innerHTML=`<label>color</label>`;
  const ci=document.createElement('input');ci.type='color';ci.value=hex(P[name].color);
  ci.oninput=()=>{P[name].color=rgb(ci.value);schedule()};cr.appendChild(ci);box.appendChild(cr);PD.appendChild(box);});
async function go(){
  if(busy){pending=true;return;} busy=true;
  const s=document.getElementById('status');s.textContent='rendering…';
  P._gender=document.getElementById('gender').value;
  try{
    const r=await fetch('/render',{method:'POST',body:JSON.stringify(P)});
    if(r.headers.get('Content-Type')=='image/png'){
      const b=await r.blob();const u=URL.createObjectURL(b);
      const img=document.getElementById('img');const old=img.src;img.src=u;if(old)URL.revokeObjectURL(old);
      s.textContent='updated ('+r.headers.get('X-Render-ms')+' ms)';
    }else s.textContent='ERROR: '+(await r.text());
  }catch(e){s.textContent='ERROR: '+e}
  busy=false; if(pending){pending=false;go();}
}
go();
</script></body></html>
